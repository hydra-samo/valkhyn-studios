<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VALKHYN · Video Editing, Motion Design, Voice-Over</title>
    <meta
      name="description"
      content="VALKHYN Studio — video editing, motion design and voice-over under one roof, from first brief to final master."
    />
    <meta property="og:title" content="VALKHYN Studio" />
    <meta
      property="og:description"
      content="Video editing, motion design and voice-over as one studio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.valkhyn.site/" />
    <meta property="og:site_name" content="VALKHYN" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.valkhyn.site/valkhyn-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.valkhyn.site/valkhyn-og.jpg" />
    <meta name="theme-color" content="#e2e5e1" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('valkhyn-theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#e2e5e1' : '#060c09');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.valkhyn.site; object-src 'none'; base-uri 'self'; frame-src 'none'; form-action 'self' mailto:;"
    />
    <link rel="icon" type="image/svg+xml" href="./valkhyn-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <!-- Self-hosted faces, preloaded so text paints once with no swap shift. -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/manrope-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/ibm-plex-sans-latin.woff2" crossorigin />
    <!-- The hero reel stays video; its first poster is preloaded for LCP. -->
    <link rel="preload" as="image" href="./video/studio-process.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
